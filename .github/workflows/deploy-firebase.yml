name: Deploy TaxTag to Google Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: mynote-f1bbc
  # `tax` is reserved globally; use mynote-tax → https://mynote-tax.web.app
  SITE_ID: mynote-tax
  HOSTING_TARGET: tax

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve deploy credentials
        id: creds
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            echo "Using FIREBASE_TOKEN for deploy"
          elif [ -n "$GCP_SA_KEY" ]; then
            echo "mode=sa" >> "$GITHUB_OUTPUT"
            echo "Using GCP_SA_KEY for deploy"
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "::error::Missing FIREBASE_TOKEN and GCP_SA_KEY — cannot deploy"
            exit 1
          fi

      - name: Authenticate to Google Cloud (service account)
        if: steps.creds.outputs.mode == 'sa'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.creds.outputs.mode == 'sa'
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Firebase / create Hosting site
        if: steps.creds.outputs.mode == 'sa'
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud services enable firebase.googleapis.com firebasehosting.googleapis.com --project "$PROJECT_ID" || true

          # Create is best-effort: site may already exist (409).
          npx firebase-tools@13 hosting:sites:create "$SITE_ID" \
            --project "$PROJECT_ID" --non-interactive || true

          npx firebase-tools@13 target:apply hosting "$HOSTING_TARGET" "$SITE_ID" \
            --project "$PROJECT_ID" --non-interactive

      - name: Deploy Hosting + Firestore rules (service account)
        if: steps.creds.outputs.mode == 'sa'
        run: |
          npx firebase-tools@13 deploy --only hosting:${HOSTING_TARGET},firestore:rules \
            --project "$PROJECT_ID" \
            --non-interactive

      - name: Deploy Hosting + Firestore rules (CI token)
        if: steps.creds.outputs.mode == 'token'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          npx firebase-tools@13 hosting:sites:create "$SITE_ID" \
            --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive || true
          npx firebase-tools@13 target:apply hosting "$HOSTING_TARGET" "$SITE_ID" \
            --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
          npx firebase-tools@13 deploy --only hosting:${HOSTING_TARGET},firestore:rules \
            --project "$PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

      - name: Allow site on Firebase Auth authorized domains
        if: steps.creds.outputs.mode == 'sa'
        continue-on-error: true
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          CFG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/config"
          export CURRENT="$(curl -sS -H "Authorization: Bearer ${TOKEN}" "$CFG_URL")"
          python3 - <<'PY' > /tmp/auth-config-patch.json
          import json, os
          cfg = json.loads(os.environ["CURRENT"])
          domains = list(cfg.get("authorizedDomains") or [])
          for d in ("mynote-tax.web.app", "mynote-tax.firebaseapp.com"):
              if d not in domains:
                  domains.append(d)
          print(json.dumps({"authorizedDomains": domains}))
          PY
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/auth-config-patch.json \
            "${CFG_URL}?updateMask=authorizedDomains"
          echo

      - name: Summary
        run: |
          {
            echo "## TaxTag permanent link (MyNote Firebase)"
            echo "- App: https://${SITE_ID}.web.app"
            echo "- Also: https://${SITE_ID}.firebaseapp.com"
            echo "- Project: ${PROJECT_ID}"
            echo "- Build: see public/js/build.js"
          } >> "$GITHUB_STEP_SUMMARY"
