name: Deploy my-tax (Cloud Run + Hosting)

on:
  push:
    branches: [main]
    paths:
      - "my-tax/**"
      - "firebase.json"
      - ".firebaserc"
      - "firestore.rules"
      - ".github/workflows/deploy-my-tax-cloudrun.yml"
  workflow_dispatch:

env:
  PROJECT_ID: mynote-f1bbc
  REGION: asia-southeast1
  SERVICE: my-tax
  REPO: my-tax
  SITE_ID: mynote-mytax
  BUCKET: mynote-f1bbc-my-tax

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Enable APIs + bucket
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud services enable \
            run.googleapis.com \
            artifactregistry.googleapis.com \
            cloudbuild.googleapis.com \
            storage.googleapis.com \
            aiplatform.googleapis.com \
            firebase.googleapis.com \
            firebasehosting.googleapis.com \
            --project "$PROJECT_ID" || true

          if ! gcloud storage buckets describe "gs://${BUCKET}" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${BUCKET}" \
              --project="$PROJECT_ID" \
              --location="$REGION" \
              --uniform-bucket-level-access
          fi

      - name: Ensure Artifact Registry
        run: |
          gcloud artifacts repositories describe "$REPO" --location="$REGION" --project="$PROJECT_ID" \
            || gcloud artifacts repositories create "$REPO" \
              --repository-format=docker \
              --location="$REGION" \
              --description="my-tax images" \
              --project="$PROJECT_ID"

      - name: Build and push image
        working-directory: my-tax
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA}"
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=_IMAGE="$IMAGE" \
            --project "$PROJECT_ID"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --max-instances=3 \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},MY_TAX_GCS_BUCKET=${BUCKET},MY_TAX_REQUIRE_GCS=0,VERTEX_LOCATION=${REGION},VERTEX_MODEL=gemini-2.5-flash" \
            --project="$PROJECT_ID"

      - name: Create Hosting site + rewrite to Cloud Run
        run: |
          set -euo pipefail
          npx --yes firebase-tools@13 hosting:sites:create "$SITE_ID" \
            --project "$PROJECT_ID" --non-interactive || true
          npx --yes firebase-tools@13 target:apply hosting mytax "$SITE_ID" \
            --project "$PROJECT_ID" --non-interactive
          npx --yes firebase-tools@13 deploy --only hosting:mytax,firestore:rules,storage \
            --project "$PROJECT_ID" --non-interactive

      - name: Allow mynote-mytax.web.app on Auth domains
        continue-on-error: true
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          CFG_URL="https://identitytoolkit.googleapis.com/admin/v2/projects/${PROJECT_ID}/config"
          export CURRENT="$(curl -sS -H "Authorization: Bearer ${TOKEN}" "$CFG_URL")"
          python3 - <<'PY' > /tmp/auth-config-patch.json
          import json, os
          cfg = json.loads(os.environ["CURRENT"])
          domains = list(cfg.get("authorizedDomains") or [])
          for d in ("mynote-mytax.web.app", "mynote-mytax.firebaseapp.com"):
              if d not in domains:
                  domains.append(d)
          print(json.dumps({"authorizedDomains": domains}))
          PY
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d @/tmp/auth-config-patch.json \
            "${CFG_URL}?updateMask=authorizedDomains"
          echo

      - name: Summary
        run: |
          {
            echo "## my-tax on MyNote"
            echo "- App: https://${SITE_ID}.web.app"
            echo "- Filings: https://${SITE_ID}.web.app/filings"
            echo "- Calculator: https://${SITE_ID}.web.app/calc"
            echo "- Cloud Run: ${SERVICE} (${REGION})"
          } >> "$GITHUB_STEP_SUMMARY"
